<style>
/* ════════════════════════════════════════
   HERO  (with video background)
════════════════════════════════════════ */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 90px 2rem 5rem;
  position: relative;
  overflow: hidden;
}

/* Video background */
.hero-video-bg {
  position: absolute; inset: 0; z-index: 0;
  overflow: hidden;
}
.hero-video-bg video {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.12;
  mix-blend-mode: screen;
}
.hero-video-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 70% at 50% 100%, var(--bg) 0%, transparent 70%),
    radial-gradient(ellipse 100% 30% at 50% 0%, var(--bg) 0%, transparent 80%),
    linear-gradient(to right, var(--bg) 0%, transparent 35%, transparent 65%, var(--bg) 100%);
}

.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 55% at 68% 42%, rgba(101,93,249,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 18% 75%, rgba(56,189,248,0.04) 0%, transparent 55%);
  pointer-events: none;
}
.hero-grid {
  position: absolute; inset: 0; z-index: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 75% 75% at 65% 28%, black 0%, transparent 68%);
  opacity: 0.4;
  pointer-events: none;
}
.hero-inner {
  max-width: 1200px; margin: 0 auto; width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5rem;
  align-items: center;
  position: relative; z-index: 1;
}

/* Badge */
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  border-radius: 100px;
  background: var(--accent-dim);
  border: 1px solid rgba(101,93,249,0.3);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 1.75rem;
  animation: fadeUp 0.5s ease both;
}
.hero-badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulseDot 2s ease infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* Headline */
.hero h1 {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: clamp(2.4rem, 4.2vw, 3.5rem);
  line-height: 1.1;
  letter-spacing: -0.035em;
  margin-bottom: 1.35rem;
  animation: fadeUp 0.6s 0.1s ease both;
  color: var(--fg);
}
.hero h1 em {
  font-style: normal;
  background: var(--brand-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  color: var(--fg2);
  font-size: 1.05rem;
  font-weight: 450;
  line-height: 1.8;
  max-width: 420px;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.6s 0.2s ease both;
}

/* ── Store Buttons ── */
.hero-ctas {
  display: flex; gap: 12px; flex-wrap: wrap;
  animation: fadeUp 0.6s 0.3s ease both;
}
.btn-store {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 20px;
  border-radius: 12px;
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.22s;
}
.btn-store-apple {
  background: #000;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.15);
}
[data-theme="light"] .btn-store-apple {
  background: #000;
  color: #fff;
}
.btn-store-apple:hover {
  background: #1a1a1a;
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.4);
}
.btn-store-google {
  background: #fff;
  color: #1f1f1f;
  border: 1px solid rgba(0,0,0,0.12);
}
[data-theme="light"] .btn-store-google {
  border-color: rgba(0,0,0,0.15);
}
.btn-store-google:hover {
  background: #f5f5f5;
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.15);
}
.btn-store-logo { width: 22px; height: 22px; display: block; flex-shrink: 0; }
.btn-store-text { display: flex; flex-direction: column; line-height: 1.25; }
.btn-store-small { font-size: 0.64rem; font-weight: 500; opacity: 0.7; }
.btn-store-name { font-size: 0.92rem; font-weight: 800; }

/* Trust line */
.hero-trust {
  margin-top: 1.75rem;
  color: var(--fg3);
  font-size: 0.82rem;
  font-weight: 500;
  display: flex; align-items: center; gap: 1rem;
  animation: fadeUp 0.6s 0.4s ease both;
}
.hero-trust-stars { color: #f59e0b; letter-spacing: 2px; }

/* ── iPhone 17 Pro Max SVG frame ── */
.phone-gallery {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: -20px;
  position: relative;
  animation: fadeIn 0.9s 0.3s ease both;
}
.phone-glow {
  position: absolute;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(101,93,249,0.2) 0%, transparent 70%);
  z-index: 0;
  pointer-events: none;
}

/* iPhone 17 Pro SVG wrapper */
.iphone17-main {
  width: 260px;
  position: relative; z-index: 2;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 50px 90px rgba(0,0,0,0.8)) drop-shadow(0 10px 30px rgba(0,0,0,0.5));
}
.iphone17-main:hover { transform: translateY(-10px) rotate(-1deg) scale(1.02); }
.iphone17-side {
  width: 210px;
  opacity: 0.55;
  position: relative; z-index: 1;
  transform: scale(0.85) translateX(10px);
  filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
}

/* ════════════════════════════════════════
   STATS BAR
════════════════════════════════════════ */
.stats-bar {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 3rem 2rem;
}
.stats-bar-inner {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 2rem; text-align: center;
}
.stat-num {
  font-family: 'Manrope', sans-serif;
  font-size: 2.2rem; font-weight: 800;
  color: var(--accent);
  line-height: 1.1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 0.82rem; font-weight: 500; color: var(--fg3); margin-top: 6px; }

/* ════════════════════════════════════════
   SECTIONS
════════════════════════════════════════ */
.section { padding: 7rem 2rem; }
.section-inner { max-width: 1100px; margin: 0 auto; }
.section-eyebrow {
  display: inline-block;
  font-size: 0.72rem; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1rem;
}
.section-title {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
  letter-spacing: -0.035em; line-height: 1.12;
  margin-bottom: 1rem; color: var(--fg);
}
.section-sub {
  color: var(--fg2); font-size: 1rem; font-weight: 450;
  max-width: 520px; line-height: 1.8;
}

/* ════════════════════════════════════════
   FEATURES GRID
════════════════════════════════════════ */
.features-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1.5px; background: var(--border);
  border-radius: var(--radius-lg); overflow: hidden; margin-top: 4rem;
}
.feature-card {
  background: var(--surface); padding: 2.75rem;
  position: relative; overflow: hidden; transition: background 0.2s;
}
.feature-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.feature-card:hover { background: var(--surface2); }
.feature-card:hover::before { opacity: 1; }
.feature-icon {
  width: 50px; height: 50px; border-radius: 13px;
  background: var(--accent-dim); border: 1px solid rgba(101,93,249,0.2);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 1.5rem;
  transition: transform 0.3s, box-shadow 0.3s;
}
.feature-icon svg {
  width: 24px; height: 24px;
  stroke: var(--accent); fill: none;
  stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}
.feature-card:hover .feature-icon {
  transform: scale(1.08);
  box-shadow: 0 0 24px var(--accent-glow);
}
.feature-card h3 {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: 1.05rem; margin-bottom: 0.6rem; letter-spacing: -0.01em;
}
.feature-card p { color: var(--fg2); font-size: 0.88rem; line-height: 1.8; font-weight: 450; font-family: 'Inter', sans-serif; }

/* ════════════════════════════════════════
   APP SCREENSHOTS SECTION
════════════════════════════════════════ */
.screenshots-section { padding: 7rem 0 5rem; overflow: hidden; }
.screenshots-scroll-wrap { margin-top: 3.5rem; position: relative; }
.screenshots-track {
  display: flex; gap: 24px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding: 72px max(2rem, calc((100vw - 1100px) / 2)) 2.5rem;
  min-height: 680px;
}
.screenshots-track::-webkit-scrollbar { display: none; }
.screenshot-slide { flex: 0 0 auto; scroll-snap-align: center; width: 240px; }
.screenshot-slide-frame {
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
  filter: drop-shadow(0 28px 56px rgba(0,0,0,0.6));
  transform-origin: bottom center;
}
.screenshot-slide-frame:hover {
  transform: translateY(-14px) scale(1.05);
  filter: drop-shadow(0 44px 72px rgba(0,0,0,0.78));
}
.screenshot-caption {
  text-align: center; margin-top: 1.2rem;
  font-size: 0.8rem; font-weight: 600; color: var(--fg3);
}
/* Prev / Next arrow buttons */
.screenshots-nav {
  display: flex; justify-content: center; align-items: center; gap: 16px;
  margin-top: 1.5rem;
}
.screenshots-arrow {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border2);
  color: var(--fg2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; transition: all 0.2s;
  flex-shrink: 0;
}
.screenshots-arrow:hover {
  background: var(--surface2); color: var(--fg);
  border-color: var(--accent);
  transform: scale(1.08);
}
.screenshots-dots-row {
  display: flex; align-items: center; gap: 7px;
}
.screenshots-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border2); transition: all 0.3s;
  cursor: pointer; border: none;
}
.screenshots-dot.active { background: var(--accent); width: 22px; border-radius: 4px; }

/* ════════════════════════════════════════
   HOW IT WORKS
════════════════════════════════════════ */
.how-section { background: var(--bg2); }
.steps {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 2.5rem; margin-top: 4rem; position: relative;
}
.steps::before {
  content: '';
  position: absolute; top: 28px;
  left: calc(16.6% + 24px); right: calc(16.6% + 24px);
  height: 1px;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  opacity: 0.35;
}
.step { text-align: center; position: relative; }
.step-num {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-family: 'Manrope', sans-serif; font-size: 0.95rem; font-weight: 800;
  color: var(--accent); position: relative; z-index: 1;
}
.step h3 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 1rem; margin-bottom: 0.6rem; }
.step p { color: var(--fg2); font-size: 0.875rem; line-height: 1.8; font-weight: 450; }

/* ════════════════════════════════════════
   ZOMBIE CALLOUT
════════════════════════════════════════ */
.zombie-callout {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 3.5rem; margin-top: 4rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
}
.zombie-label {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px;
  border-radius: 6px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.25);
  color: var(--red); font-size: 0.72rem; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1.25rem;
}
.zombie-callout h2 {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: 1.7rem; letter-spacing: -0.03em; margin-bottom: 0.85rem; line-height: 1.2;
}
.zombie-callout p { color: var(--fg2); font-size: 0.92rem; line-height: 1.85; font-weight: 450; }
.zombie-subs { display: flex; flex-direction: column; gap: 10px; }
.zombie-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 11px; padding: 12px 16px; transition: border-color 0.2s;
}
.zombie-item.flagged { border-color: rgba(248,113,113,0.28); background: rgba(248,113,113,0.04); }
.zombie-item-logo {
  width: 36px; height: 36px; border-radius: 9px;
  flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.zombie-item-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 9px; display: block; }
.zombie-item-logo-svg {
  width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
}
.zombie-item-info { flex: 1; }
.zombie-item-name { font-weight: 700; font-size: 0.85rem; }
.zombie-item-sub { font-size: 0.72rem; color: var(--fg3); margin-top: 2px; }
.zombie-item-price { font-family: 'Manrope', sans-serif; font-size: 0.85rem; font-weight: 600; color: var(--fg2); font-variant-numeric: tabular-nums; }
.zombie-flag {
  background: var(--red-dim); border: 1px solid rgba(248,113,113,0.35);
  color: var(--red); font-size: 0.58rem; font-weight: 800;
  letter-spacing: 0.07em; padding: 3px 7px; border-radius: 5px; text-transform: uppercase;
}
.zombie-score-bar-wrap {
  display: flex; align-items: center; gap: 6px; margin-top: 5px;
}
.zombie-score-track {
  flex: 1; height: 4px; border-radius: 100px;
  background: var(--border2); overflow: hidden;
}
.zombie-score-fill {
  height: 100%; border-radius: 100px;
  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.zombie-score-fill.high  { background: var(--red); }
.zombie-score-fill.mid   { background: #f59e0b; }
.zombie-score-fill.low   { background: #22c55e; }
.zombie-score-num {
  font-size: 0.65rem; font-weight: 800; font-family: 'Manrope', sans-serif;
  font-variant-numeric: tabular-nums; color: var(--fg3); min-width: 26px; text-align: right;
}
.zombie-score-num.high { color: var(--red); }
.zombie-score-num.mid  { color: #f59e0b; }

/* ── Feature card signature badge ── */
.feature-sig-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-dim); border: 1px solid rgba(101,93,249,0.25);
  color: var(--accent); font-size: 0.6rem; font-weight: 800;
  letter-spacing: 0.09em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px; margin-bottom: 1rem;
}

/* ════════════════════════════════════════
   EMAIL SCANNER SPOTLIGHT
════════════════════════════════════════ */
.email-scanner-section { padding: 5rem 2rem; }
.email-scanner-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 5rem; align-items: center; max-width: 1100px; margin: 0 auto;
}
.email-scanner-phone-wrap {
  position: relative; display: flex; justify-content: center; align-items: center;
}
.email-scanner-phone-glow {
  position: absolute; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(101,93,249,0.18) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.email-scanner-phone-img {
  position: relative; z-index: 1;
  width: 100%; max-width: 300px; height: auto; display: block;
  filter: drop-shadow(0 40px 80px rgba(0,0,0,0.7)) drop-shadow(0 8px 24px rgba(101,93,249,0.2));
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.email-scanner-phone-img:hover { transform: translateY(-10px) scale(1.02); }
.email-scanner-copy .section-eyebrow { margin-bottom: 1.25rem; }
.email-scanner-copy h2 {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: clamp(1.7rem, 2.8vw, 2.4rem); letter-spacing: -0.035em;
  line-height: 1.15; margin-bottom: 1.25rem; color: var(--fg);
}
.email-scanner-copy p { color: var(--fg2); font-size: 0.93rem; line-height: 1.85; margin-bottom: 1rem; font-weight: 450; }
.email-scanner-perks { list-style: none; padding: 0; margin: 1.5rem 0 0; display: flex; flex-direction: column; gap: 0.65rem; }
.email-scanner-perks li {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.88rem; color: var(--fg2); font-weight: 500;
}
.email-scanner-perks li span {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.25);
  color: var(--teal); font-size: 0.7rem; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}
/* Scanner window */
.scanner-window {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.04);
}
.scanner-titlebar {
  display: flex; align-items: center; gap: 7px;
  padding: 12px 16px; background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.scanner-dot {
  width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
}
.scanner-dot.red    { background: #ff5f57; }
.scanner-dot.yellow { background: #febc2e; }
.scanner-dot.green  { background: #28c840; }
.scanner-title { font-size: 0.72rem; font-weight: 600; color: var(--fg3); margin-left: 4px; }
.scanner-body { padding: 18px; min-height: 240px; }
.scanner-status {
  font-size: 0.82rem; font-weight: 600; padding: 8px 0 14px;
  display: flex; align-items: center; gap: 8px;
}
.scanner-status.connecting { color: var(--fg3); }
.scanner-status.scanning   { color: var(--teal); }
.scanner-status.done       { color: #22c55e; }
.scanner-dots::after {
  content: ''; animation: scanDots 1.2s steps(4, end) infinite;
}
@keyframes scanDots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}
.scanner-spinner {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(56,189,248,0.25);
  border-top-color: var(--teal);
  animation: spin 0.7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.scanner-results { display: flex; flex-direction: column; gap: 6px; }
.scanner-result-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: var(--bg2); border: 1px solid var(--border);
  animation: fadeUp 0.3s ease forwards;
  font-size: 0.8rem;
}
.scanner-check { color: #22c55e; font-weight: 900; flex-shrink: 0; font-size: 0.75rem; }
.scanner-sub-name { font-weight: 700; color: var(--fg); flex: 1; }
.scanner-sub-age  { font-size: 0.7rem; color: var(--fg3); white-space: nowrap; }
.scanner-sub-price { font-family: 'Manrope', sans-serif; font-weight: 700; color: var(--accent); font-size: 0.75rem; white-space: nowrap; }
.scanner-more { background: var(--accent-dim); border-color: rgba(101,93,249,0.2); }
.scanner-more-text { color: var(--accent); font-weight: 700; font-size: 0.8rem; }
@media (max-width: 960px) {
  .email-scanner-grid { grid-template-columns: 1fr; gap: 3rem; }
}

/* ════════════════════════════════════════
   TESTIMONIALS
════════════════════════════════════════ */
.testimonials-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem; margin-top: 3.5rem;
}
.testimonial-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 2rem;
  transition: transform 0.25s, box-shadow 0.25s;
}
.testimonial-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.25); }
.testimonial-stars { color: #f59e0b; font-size: 0.88rem; margin-bottom: 1rem; }
.testimonial-text { font-size: 0.9rem; color: var(--fg2); line-height: 1.8; margin-bottom: 1.5rem; font-style: italic; font-weight: 450; }
.testimonial-author { display: flex; align-items: center; gap: 10px; }
.testimonial-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--brand-gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 800; color: white; flex-shrink: 0;
}
.testimonial-name { font-weight: 700; font-size: 0.875rem; }
.testimonial-handle { font-size: 0.75rem; color: var(--fg3); margin-top: 1px; }

/* ════════════════════════════════════════
   FAQ
════════════════════════════════════════ */
.faq-section { background: var(--bg2); }
.faq-list { max-width: 700px; margin: 3.5rem auto 0; }
.faq-item { border-bottom: 1px solid var(--border); }
.faq-question {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.35rem 0; cursor: pointer; font-weight: 700; font-size: 0.95rem;
  gap: 1rem; transition: color 0.2s; user-select: none;
}
.faq-question:hover { color: var(--accent); }
.faq-chevron {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; flex-shrink: 0;
  transition: transform 0.3s, background 0.2s; color: var(--fg3);
}
.faq-chevron.open { transform: rotate(180deg); background: var(--accent-dim); color: var(--accent); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; }
.faq-answer.open { max-height: 300px; padding-bottom: 1.35rem; }
.faq-answer p { color: var(--fg2); font-size: 0.9rem; line-height: 1.85; font-weight: 450; }

/* ════════════════════════════════════════
   GOOGLE DATA DISCLOSURE
════════════════════════════════════════ */
.google-disclosure {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 2.75rem 3rem;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2rem;
  align-items: flex-start;
  max-width: 820px;
  margin: 0 auto;
}
.google-disclosure-icon {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--accent-dim);
  border: 1px solid rgba(101,93,249,0.2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.google-disclosure-icon svg {
  width: 26px; height: 26px;
  stroke: var(--accent); fill: none;
  stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}
.google-disclosure h3 {
  font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 1.05rem;
  letter-spacing: -0.01em; margin-bottom: 0.75rem;
  color: var(--fg);
}
.google-disclosure p {
  color: var(--fg2); font-size: 0.88rem;
  line-height: 1.85; font-weight: 450;
  font-family: 'Inter', sans-serif;
}
@media (max-width: 600px) {
  .google-disclosure { grid-template-columns: 1fr; padding: 2rem; }
  .google-disclosure-icon { display: none; }
}

/* ════════════════════════════════════════
   PRICING
════════════════════════════════════════ */
.pricing-section { padding: 7rem 2rem; }
.pricing-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem; margin-top: 2rem; align-items: stretch;
}
.pricing-2col {
  grid-template-columns: repeat(2, 1fr);
  max-width: 720px; margin-left: auto; margin-right: auto;
}
/* Billing toggle */
.billing-toggle {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 2.5rem 0 0;
}
.billing-label {
  font-size: 0.9rem; font-weight: 600; color: var(--fg3); transition: color 0.2s;
}
.billing-label.active { color: var(--fg); }
.toggle-switch {
  width: 48px; height: 26px; border-radius: 100px;
  background: var(--border2); border: none; cursor: pointer;
  position: relative; transition: background 0.25s; flex-shrink: 0;
}
.toggle-switch.on { background: var(--accent); }
.toggle-knob {
  position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  transition: transform 0.25s; display: block;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.toggle-switch.on .toggle-knob { transform: translateX(22px); }
.billing-save-pill {
  display: inline-block; margin-left: 7px;
  background: rgba(34,197,94,0.13); border: 1px solid rgba(34,197,94,0.3);
  color: #22c55e; font-size: 0.65rem; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 5px; vertical-align: middle;
}
.pricing-annual-note {
  font-size: 0.78rem; color: var(--fg3); font-weight: 500;
  margin-top: -0.4rem; margin-bottom: 0.4rem;
}
.pricing-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 2.5rem 2rem;
  display: flex; flex-direction: column; position: relative;
  transition: transform 0.25s, box-shadow 0.25s;
}
.pricing-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.pricing-card.featured {
  border-color: rgba(101,93,249,0.5);
  background: linear-gradient(160deg, rgba(101,93,249,0.08) 0%, var(--surface) 60%);
  box-shadow: 0 0 0 1px rgba(101,93,249,0.2), 0 16px 48px rgba(101,93,249,0.12);
}
.pricing-badge {
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  background: var(--brand-gradient); color: #fff;
  font-size: 0.65rem; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 4px 14px; border-radius: 100px;
  white-space: nowrap;
}
.pricing-plan {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.75rem;
}
.pricing-price {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: 2.6rem; line-height: 1; letter-spacing: -0.04em;
  color: var(--fg); margin-bottom: 0.25rem;
  font-variant-numeric: tabular-nums;
}
.pricing-price sup { font-size: 1.1rem; font-weight: 700; vertical-align: super; margin-right: 2px; }
.pricing-price sub { font-size: 0.9rem; font-weight: 500; color: var(--fg3); vertical-align: baseline; }
.pricing-desc { font-size: 0.83rem; color: var(--fg3); margin-bottom: 2rem; line-height: 1.6; font-weight: 450; }
.pricing-divider { height: 1px; background: var(--border); margin-bottom: 1.75rem; }
.pricing-features { list-style: none; padding: 0; margin: 0 0 2rem; flex: 1; display: flex; flex-direction: column; gap: 0.85rem; }
.pricing-feature {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 0.85rem; color: var(--fg2); font-weight: 450; line-height: 1.5;
}
.pricing-feature-icon { flex-shrink: 0; margin-top: 1px; font-size: 0.75rem; }
.pricing-feature-icon.yes { color: #34d399; }
.pricing-feature-icon.no { color: var(--fg3); opacity: 0.4; }
.pricing-feature.dimmed { opacity: 0.45; }
.pricing-cta {
  display: block; width: 100%; padding: 13px;
  border-radius: 12px; text-align: center;
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: 0.9rem; text-decoration: none; cursor: pointer;
  border: none; transition: all 0.22s;
}
.pricing-cta-free {
  background: transparent; color: var(--fg2);
  border: 1.5px solid var(--border2);
}
.pricing-cta-free:hover { border-color: var(--accent); color: var(--accent); }
.pricing-cta-paid {
  background: var(--brand-gradient); color: #fff;
  box-shadow: 0 6px 20px rgba(101,93,249,0.35);
}
.pricing-cta-paid:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(101,93,249,0.45); }
.pricing-note {
  text-align: center; margin-top: 2rem;
  font-size: 0.8rem; color: var(--fg3); font-weight: 450;
}
.price-ast {
  font-size: 0.75rem; font-weight: 700; color: var(--fg3);
  vertical-align: super; margin-left: 1px;
}
.pricing-region-note {
  text-align: center; margin-top: 0.5rem;
  font-size: 0.75rem; color: var(--fg3); font-weight: 450; font-style: italic;
}
@media (max-width: 960px) {
  .pricing-grid, .pricing-2col { grid-template-columns: 1fr; max-width: 420px; margin-left: auto; margin-right: auto; }
}

/* ════════════════════════════════════════
   CTA BANNER
════════════════════════════════════════ */
.cta-section { padding: 7rem 2rem; }
.cta-inner {
  max-width: 780px; margin: 0 auto; text-align: center;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 28px; padding: 5rem 3rem;
  position: relative; overflow: hidden;
}
.cta-inner::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 75% 55% at 50% 0%, rgba(101,93,249,0.15), transparent 60%);
  pointer-events: none;
}
.cta-inner h2 {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: clamp(1.8rem, 3vw, 2.4rem); letter-spacing: -0.035em;
  margin-bottom: 0.85rem; position: relative; color: var(--fg);
}
.cta-inner p {
  color: var(--fg2); font-size: 1rem; margin-bottom: 2.5rem;
  position: relative; font-weight: 450; line-height: 1.75;
}
.cta-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; position: relative; }

/* ════════════════════════════════════════
   WAITLIST
════════════════════════════════════════ */
.waitlist-section { padding: 5rem 2rem; }
.waitlist-inner {
  max-width: 560px; margin: 0 auto; text-align: center;
}
.waitlist-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent-dim); border: 1px solid rgba(101,93,249,0.25);
  color: var(--accent); border-radius: 100px;
  padding: 5px 14px; font-size: 0.75rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 1.5rem;
}
.waitlist-inner h2 {
  font-family: 'Manrope', sans-serif; font-weight: 800;
  font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -0.03em;
  margin-bottom: 0.85rem; color: var(--fg);
}
.waitlist-inner > p {
  color: var(--fg2); font-size: 0.95rem; line-height: 1.75;
  margin-bottom: 2rem;
}
.waitlist-form {
  display: flex; gap: 8px; max-width: 460px; margin: 0 auto 0.5rem;
}
.waitlist-input {
  flex: 1; height: 48px; padding: 0 16px;
  background: var(--surface); border: 1.5px solid var(--border2);
  border-radius: 12px; color: var(--fg);
  font-family: 'Inter', sans-serif; font-size: 0.9rem;
  outline: none; transition: border-color 0.2s;
}
.waitlist-input:focus { border-color: var(--accent); }
.waitlist-input::placeholder { color: var(--fg3); }
.waitlist-btn {
  height: 48px; padding: 0 24px;
  background: var(--brand-gradient); color: #fff;
  border: none; border-radius: 12px;
  font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 0.9rem;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(101,93,249,0.35);
  transition: opacity 0.2s, transform 0.2s;
}
.waitlist-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
.waitlist-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.waitlist-success {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25);
  color: var(--teal); border-radius: 12px; padding: 12px 20px;
  font-weight: 600; font-size: 0.9rem; margin-bottom: 1rem;
}
.waitlist-error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }
.waitlist-note { color: var(--fg3); font-size: 0.78rem; margin-top: 0.75rem; }
@media (max-width: 480px) {
  .waitlist-form { flex-direction: column; }
  .waitlist-input, .waitlist-btn { width: 100%; }
}

/* ════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════ */
@media (max-width: 960px) {
  .hero-inner { grid-template-columns: 1fr; text-align: center; gap: 3rem; }
  .hero-sub { margin: 0 auto 2.5rem; }
  .hero-ctas { justify-content: center; }
  .hero-trust { justify-content: center; }
  .phone-gallery { margin-top: 1rem; }
  .iphone-frame-side { display: none; }
  .features-grid { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  .steps::before { display: none; }
  .zombie-callout { grid-template-columns: 1fr; gap: 2.5rem; }
  .testimonials-grid { grid-template-columns: 1fr; }
  .stats-bar-inner { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .hero { padding: 90px 1.25rem 4rem; }
